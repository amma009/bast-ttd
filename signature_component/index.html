<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Signature Pad</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            background: transparent;
            font-family: Arial, sans-serif;
        }

        #container {
            width: 100%;
        }

        #canvas-wrapper {
            width: 100%;
            background: white;
            border: 1px solid #999;
            border-radius: 8px;
            overflow: hidden;
        }

        #signature-canvas {
            display: block;
            width: 100%;
            height: 180px;
            background: white;
            touch-action: none;
            cursor: crosshair;
        }

        #toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        #clear-button {
            border: 1px solid #aaa;
            background: white;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 13px;
            cursor: pointer;
        }

        #clear-button:hover {
            background: #f0f0f0;
        }

        #status {
            font-size: 12px;
            color: #777;
        }
    </style>
</head>

<body>

<div id="container">

    <div id="canvas-wrapper">
        <canvas id="signature-canvas"></canvas>
    </div>

    <div id="toolbar">
        <button id="clear-button" type="button">
            🗑️ Clear
        </button>

        <span id="status">
            Belum ada tanda tangan
        </span>
    </div>

</div>


<script>

    // =====================================================
    // STREAMLIT COMMUNICATION
    // =====================================================

    function sendComponentReady() {

        window.parent.postMessage(
            {
                isStreamlitMessage: true,
                type: "streamlit:componentReady",
                apiVersion: 1
            },
            "*"
        );

    }


    function sendComponentValue(value) {

        window.parent.postMessage(
            {
                isStreamlitMessage: true,
                type: "streamlit:setComponentValue",
                value: value
            },
            "*"
        );

    }


    function setFrameHeight(height) {

        window.parent.postMessage(
            {
                isStreamlitMessage: true,
                type: "streamlit:setFrameHeight",
                height: height
            },
            "*"
        );

    }


    // =====================================================
    // ELEMENT
    // =====================================================

    const canvas =
        document.getElementById("signature-canvas");

    const ctx =
        canvas.getContext("2d");

    const clearButton =
        document.getElementById("clear-button");

    const status =
        document.getElementById("status");


    // =====================================================
    // STATE
    // =====================================================

    let drawing = false;

    let hasSignature = false;

    let lastX = 0;

    let lastY = 0;


    // =====================================================
    // CANVAS
    // =====================================================

    function resizeCanvas() {

        const rect =
            canvas.getBoundingClientRect();

        const ratio =
            window.devicePixelRatio || 1;

        canvas.width =
            Math.round(rect.width * ratio);

        canvas.height =
            Math.round(rect.height * ratio);

        ctx.setTransform(
            ratio,
            0,
            0,
            ratio,
            0,
            0
        );

        ctx.lineWidth = 2;

        ctx.lineCap = "round";

        ctx.lineJoin = "round";

        ctx.strokeStyle = "#000000";

        ctx.fillStyle = "#000000";
    }


    resizeCanvas();


    // =====================================================
    // POSITION
    // =====================================================

    function getPosition(event) {

        const rect =
            canvas.getBoundingClientRect();

        return {
            x: event.clientX - rect.left,
            y: event.clientY - rect.top
        };

    }


    // =====================================================
    // START DRAWING
    // =====================================================

    function startDrawing(event) {

        event.preventDefault();

        drawing = true;

        const position =
            getPosition(event);

        lastX = position.x;

        lastY = position.y;

        try {

            canvas.setPointerCapture(
                event.pointerId
            );

        } catch (error) {
        }

        // Titik awal
        ctx.beginPath();

        ctx.arc(
            lastX,
            lastY,
            1,
            0,
            Math.PI * 2
        );

        ctx.fill();

        hasSignature = true;

        status.textContent =
            "Tanda tangan sedang dibuat";

    }


    // =====================================================
    // DRAW
    // =====================================================

    function draw(event) {

        if (!drawing) {
            return;
        }

        event.preventDefault();

        const position =
            getPosition(event);

        ctx.beginPath();

        ctx.moveTo(
            lastX,
            lastY
        );

        ctx.lineTo(
            position.x,
            position.y
        );

        ctx.stroke();

        lastX = position.x;

        lastY = position.y;

        hasSignature = true;

        status.textContent =
            "Tanda tangan sudah dibuat";

    }


    // =====================================================
    // STOP DRAWING
    // =====================================================

    function stopDrawing(event) {

        if (!drawing) {
            return;
        }

        event.preventDefault();

        drawing = false;

        try {

            canvas.releasePointerCapture(
                event.pointerId
            );

        } catch (error) {
        }

        if (!hasSignature) {
            return;
        }

        // Ambil gambar canvas
        const imageData =
            canvas.toDataURL("image/png");

        // Kirim ke Streamlit
        sendComponentValue(imageData);

    }


    // =====================================================
    // EVENTS
    // =====================================================

    canvas.addEventListener(
        "pointerdown",
        startDrawing
    );

    canvas.addEventListener(
        "pointermove",
        draw
    );

    canvas.addEventListener(
        "pointerup",
        stopDrawing
    );

    canvas.addEventListener(
        "pointercancel",
        stopDrawing
    );


    // =====================================================
    // CLEAR
    // =====================================================

    clearButton.addEventListener(
        "click",
        function(event) {

            event.preventDefault();

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            hasSignature = false;

            status.textContent =
                "Belum ada tanda tangan";

            sendComponentValue("");

        }
    );


    // =====================================================
    // STREAMLIT RENDER
    // =====================================================

    window.addEventListener(
        "message",
        function(event) {

            if (!event.data) {
                return;
            }

            if (
                event.data.type ===
                "streamlit:render"
            ) {

                setFrameHeight(225);

            }

        }
    );


    // =====================================================
    // RESIZE
    // =====================================================

    window.addEventListener(
        "resize",
        function() {

            // Jangan resize canvas setelah user
            // mulai tanda tangan karena bisa menghapus
            // gambar.
            if (!hasSignature) {
                resizeCanvas();
            }

            setFrameHeight(225);

        }
    );


    // =====================================================
    // START COMPONENT
    // =====================================================

    sendComponentReady();

    setFrameHeight(225);

</script>

</body>
</html>
